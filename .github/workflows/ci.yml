name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore PiNet.slnx
      - name: Build
        run: dotnet build PiNet.slnx -c Release --no-restore
      - name: Test
        run: dotnet test PiNet.slnx -c Release --no-build --logger trx
