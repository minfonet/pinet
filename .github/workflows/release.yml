name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  verify-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test
        run: dotnet test PiNet.slnx -c Release

      - name: Pack global tool
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$GITHUB_REF_NAME" = "$VERSION" ]; then VERSION="0.0.0-local"; fi
          dotnet pack src/PiNet.Cli/PiNet.Cli.csproj -c Release -o artifacts/packages -p:Version="$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/packages/*.nupkg

  self-contained:
    needs: verify-and-pack
    strategy:
      fail-fast: false
      matrix:
        rid: [ win-x64, linux-x64, osx-arm64 ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish ${{ matrix.rid }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$GITHUB_REF_NAME" = "$VERSION" ]; then VERSION="0.0.0-local"; fi
          dotnet publish src/PiNet.Cli/PiNet.Cli.csproj -c Release \
            -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true -p:PublishTrimmed=false \
            -p:Version="$VERSION" \
            -o artifacts/publish/${{ matrix.rid }}
          (cd artifacts/publish && zip -r "pinet-${{ matrix.rid }}.zip" "${{ matrix.rid }}")

      - uses: actions/upload-artifact@v4
        with:
          name: pinet-${{ matrix.rid }}
          path: artifacts/publish/pinet-${{ matrix.rid }}.zip

  release:
    needs: [ verify-and-pack, self-contained ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish to NuGet
        if: ${{ secrets.NUGET_API_KEY != '' }}
        run: dotnet nuget push artifacts/*.nupkg --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(ls artifacts/*.nupkg artifacts/*.zip 2>/dev/null || true)
          if [ -z "$FILES" ]; then echo "No release assets found"; exit 1; fi
          gh release create "$GITHUB_REF_NAME" $FILES --generate-notes --title "Pi.NET $GITHUB_REF_NAME"
